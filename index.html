<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f172a"><meta name="description" content="Lärardashboard med schema, zoom och direktredigerade anteckningar."><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-192.png"><link rel="stylesheet" href="styles.css"><title>Min lärardashboard</title></head><body>
<main class="dashboard"><header><div><small>MIN LÄRARDASHBOARD</small><div class="date"><b id="weekday"></b><span id="date"></span></div></div><div class="clock">◷ <b id="time"></b></div></header>
<section class="schedule panel"><div class="head"><h2>▧ Mitt schema</h2><label class="secondary">⇧ <span id="uploadLabel">Ladda upp</span><input id="file" type="file" accept="image/*" hidden></label></div><div class="scheduleBody"><label id="empty" class="empty">▧<b>Lägg in din schemabild</b><span>Välj ett foto eller en skärmbild</span><input id="file2" type="file" accept="image/*" hidden></label><div id="preview" class="preview hidden"><div id="viewport"><img id="scheduleImage" draggable="false"></div><div class="zoom"><button id="zoomOut">−</button><b id="zoomText">100%</b><button id="zoomIn">＋</button><button id="zoomReset">↻</button></div><button id="removeImage" class="remove">×</button></div></div></section>
<section class="cards panel"><div class="head"><div><h2>☑ Mina block och anteckningar</h2><small id="progress"></small></div><button id="newButton" class="primary">＋ Nytt</button></div><div id="createChooser" class="chooser hidden"><button data-create="checklist">☑ <span><b>Block med punkter</b><small>Skapas direkt nedanför</small></span></button><button data-create="note">▤ <span><b>Textanteckning</b><small>Skriv direkt i blocket</small></span></button></div><div id="cardList" class="cardList"></div></section></main>
<script src="app.js" defer></script></body></html>
