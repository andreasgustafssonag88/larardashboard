<!doctype html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="Lärardashboard med schema, datum, klocka och öppningsbara anteckningsblock.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <title>Min lärardashboard</title>
</head>
<body>
  <main class="dashboard">
    <header class="topbar">
      <div class="topbar-orb"></div>
      <div class="brand">
        <span>MIN LÄRARDASHBOARD</span>
        <div class="date-row"><strong id="weekday">Måndag</strong><small id="dateText"></small></div>
      </div>
      <div class="clock"><span class="clock-icon">◷</span><strong id="timeText">00:00</strong><small id="secondsText">00</small></div>
    </header>

    <section class="schedule panel">
      <div class="panel-head">
        <h2><span class="head-icon indigo">▧</span>Mitt schema</h2>
        <label class="secondary-button">⇧ <span id="uploadText">Ladda upp</span><input id="scheduleFile" type="file" accept="image/*" hidden></label>
      </div>
      <div class="schedule-body">
        <label id="scheduleEmpty" class="schedule-empty">
          <span>▧</span><strong>Lägg in din schemabild</strong><small>Välj ett foto eller en skärmbild</small>
          <input id="scheduleFileEmpty" type="file" accept="image/*" hidden>
        </label>
        <div id="schedulePreview" class="schedule-preview hidden">
          <img id="scheduleImage" alt="Mitt schema">
          <button id="removeSchedule" class="remove-image" aria-label="Ta bort schemabild">×</button>
        </div>
      </div>
    </section>

    <section class="boards panel">
      <div class="panel-head boards-head">
        <div class="boards-title"><span class="head-icon amber">☑</span><div><h2>Mina anteckningsblock</h2><small id="progressText">0 av 0 punkter färdiga</small></div></div>
        <button id="newBoardButton" class="primary-button">＋ Nytt block</button>
      </div>
      <div id="boardList" class="board-list"></div>
    </section>
  </main>

  <dialog id="boardDialog" class="dialog">
    <form id="boardForm">
      <div class="dialog-head"><h3>Nytt anteckningsblock</h3><button type="button" data-close="boardDialog">×</button></div>
      <label>Namn på blocket<input name="title" required placeholder="Exempel: Schema jobb"></label>
      <fieldset><legend>Färg</legend><div class="color-picker">
        <label><input type="radio" name="color" value="indigo" checked><span class="color indigo-bg"></span></label>
        <label><input type="radio" name="color" value="amber"><span class="color amber-bg"></span></label>
        <label><input type="radio" name="color" value="emerald"><span class="color emerald-bg"></span></label>
        <label><input type="radio" name="color" value="sky"><span class="color sky-bg"></span></label>
        <label><input type="radio" name="color" value="rose"><span class="color rose-bg"></span></label>
      </div></fieldset>
      <button class="submit-button">Skapa block</button>
    </form>
  </dialog>

  <dialog id="itemDialog" class="dialog">
    <form id="itemForm">
      <div class="dialog-head"><h3>Ny punkt</h3><button type="button" data-close="itemDialog">×</button></div>
      <label>Vad behöver göras?<input name="text" required placeholder="Exempel: Ändra Andreas schema"></label>
      <button class="submit-button">Lägg till punkt</button>
    </form>
  </dialog>

  <script src="app.js" defer></script>
</body>
</html>
