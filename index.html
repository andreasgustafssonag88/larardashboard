<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f172a"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><link rel="icon" href="icons/icon-192.png"><title>Min lärardashboard</title></head><body><main class="dash"><header><div><small>MIN LÄRARDASHBOARD</small><div><b id="weekday"></b><span id="date"></span></div></div><strong id="clock"></strong></header><section class="panel schedule"><div class="head"><b>▧ Mitt schema</b><label>⇧ <span id="uploadLabel">Ladda upp</span><input id="file" type="file" accept="image/*" hidden></label></div><div class="scheduleBody"><label id="empty" class="empty">▧<b>Lägg in din schemabild</b><span>Välj ett foto eller en skärmbild</span><input id="file2" type="file" accept="image/*" hidden></label><div id="preview" class="preview hidden"><div id="viewport"><img id="scheduleImage" draggable="false"></div><div class="zoom"><button id="zoomOut">−</button><b id="zoomText">100%</b><button id="zoomIn">＋</button><button id="zoomReset">↻</button></div><button id="removeImage" class="remove">×</button></div></div></section><section class="panel cards"><div class="head"><div><b>☑ Mina block och anteckningar</b><small id="progress"></small></div><button id="newButton" class="primary">＋ Nytt</button></div><div id="chooser" class="chooser hidden"><button data-create="checklist">☑ <span><b>Block med punkter</b><small>Skapas direkt nedanför</small></span></button><button data-create="note">▤ <span><b>Textanteckning</b><small>Skriv direkt i blocket</small></span></button></div><div id="cardList" class="cardList"></div></section></main><script src="app.js"></script></body></html>
