<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f172a"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><link rel="stylesheet" href="styles.css"><title>Min lärardashboard</title></head><body><main class="app"><header><div><b>Min lärardashboard</b><small id="date"></small></div><strong id="clock">00:00</strong></header><div class="grid"><section class="schedule"><div class="bar"><b>Schema</b><label class="btn">Ladda upp<input id="file" type="file" accept="image/*" hidden></label></div><div class="imagebox"><label id="empty">Lägg in din schemabild<input id="file2" type="file" accept="image/*" hidden></label><div id="preview" hidden><img id="image"><button id="remove">×</button></div></div></section><aside><section class="calendar"><div class="bar"><div><b id="week"></b><small id="range"></small></div><div><button id="today">Idag</button><button id="prev">‹</button><button id="next">›</button></div></div><div id="days"></div></section><section class="notes"><div class="bar"><b>Anteckningar</b><button id="newNote">＋</button></div><div id="notes"></div></section></aside></div></main><dialog id="eventDialog"><form id="eventForm"><h3>Ny kalenderhändelse</h3><input id="eventDate" name="date" type="date" required><input name="time" type="time"><input name="title" placeholder="Händelse eller möte" required><div><button type="button" data-close>Avbryt</button><button>Spara</button></div></form></dialog><dialog id="noteDialog"><form id="noteForm"><h3>Ny anteckning</h3><input name="title" placeholder="Rubrik" required><textarea name="text" placeholder="Skriv din anteckning" required></textarea><div><button type="button" data-close>Avbryt</button><button>Spara</button></div></form></dialog><script src="app.js"></script></body></html>
